document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

pacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),box-shadow .24s cubic-bezier(.16,1,.3,1);background:#12161C;border:1px solid #22272F;border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:10px\" style-hover=\"border-color:#3A414C;box-shadow:0 24px 48px rgba(0,0,0,.55)\">\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <span style=\"font-family:'Marcellus',serif;font-size:15px;color:#C9A24A;letter-spacing:.08em\">06<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:#22272F\"><\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:12px 0 0;font-family:'Marcellus',serif;font-size:22px\">Família e sucessões<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.6;color:#A9A29A\">Divórcio, partilha, inventário e planejamento sucessório.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"escritorio\" style=\"border-top:1px solid #22272F;padding:clamp(56px,8vw,96px) 24px\">\n      <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);border:1px solid #22272F;border-radius:4px;background-color:#0C0F13;background-image:linear-gradient(180deg,rgba(10,12,15,.72) 0%,rgba(10,12,15,.92) 100%),url('https://commons.wikimedia.org/wiki/Special:FilePath/Law%20library%20in%20the%20Essex%20County%20Courthouse,%20Salem,%20Massachusetts.jpg?width=1400');background-size:cover;background-position:center;padding:clamp(32px,4vw,56px);min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:28px;min-height:clamp(360px,42vw,480px)\">\n          <image-slot id=\"logo-escritorio\" style=\"width:96px;height:96px\" shape=\"rect\" fit=\"contain\" placeholder=\"Sua logo aqui\"><\u002Fimage-slot>\n          <p style=\"margin:0;font-family:'Marcellus',serif;font-size:clamp(22px,2.8vw,30px);line-height:1.35\">“Um caso bem conduzido começa por uma conversa honesta sobre o que é possível.”<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #22272F;padding-top:20px\">\n            <span style=\"font-size:14px;font-weight:600\">{{ firmName }}<\u002Fspan>\n            <span style=\"font-size:13px;color:#A9A29A\">{{ oab }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px;min-width:0\">\n          <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C9A24A\">O escritório<\u002Fdiv>\n          <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);margin:0;font-family:'Marcellus',serif;font-size:clamp(28px,4vw,36px);line-height:1.15\">Uma banca pequena, por escolha<\u002Fh2>\n          <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);margin:0;font-size:17px;line-height:1.7;color:#A9A29A;max-width:56ch\">Quatro advogados, nenhum intermediário. Quem atende sua primeira ligação é quem vai conduzir o processo até o fim. Trabalhamos com um número limitado de casos por mês justamente para manter esse padrão de atenção.<\u002Fp>\n          <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:14px;padding-top:8px\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"color:#C9A24A;font-size:15px\">—<\u002Fspan><span style=\"font-size:16px;line-height:1.6\">Contato direto com o advogado responsável, sem call center<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"color:#C9A24A;font-size:15px\">—<\u002Fspan><span style=\"font-size:16px;line-height:1.6\">Relatório de andamento a cada movimentação do processo<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"color:#C9A24A;font-size:15px\">—<\u002Fspan><span style=\"font-size:16px;line-height:1.6\">Honorários combinados por escrito antes de qualquer trabalho<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"color:#C9A24A;font-size:15px\">—<\u002Fspan><span style=\"font-size:16px;line-height:1.6\">Atuação em todo o território nacional, presencial em São Paulo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showStats }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"resultados\" style=\"border-top:1px solid #22272F;background:#0C0F13;padding:clamp(40px,6vw,72px) 24px\">\n      <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:8px;padding-left:0\">\n          <span style=\"font-family:'Marcellus',serif;font-size:clamp(34px,4.4vw,50px);line-height:1;color:#E3C57F\">1.200+<\u002Fspan>\n          <span style=\"font-size:14px;color:#A9A29A\">processos conduzidos<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:8px;border-left:1px solid #22272F;padding-left:24px\">\n          <span style=\"font-family:'Marcellus',serif;font-size:clamp(34px,4.4vw,50px);line-height:1;color:#E3C57F\">18<\u002Fspan>\n          <span style=\"font-size:14px;color:#A9A29A\">anos de atuação<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:8px;border-left:1px solid #22272F;padding-left:24px\">\n          <span style=\"font-family:'Marcellus',serif;font-size:clamp(34px,4.4vw,50px);line-height:1;color:#E3C57F\">2h<\u002Fspan>\n          <span style=\"font-size:14px;color:#A9A29A\">tempo médio de resposta<\u002Fspan>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:8px;border-left:1px solid #22272F;padding-left:24px\">\n          <span style=\"font-family:'Marcellus',serif;font-size:clamp(34px,4.4vw,50px);line-height:1;color:#E3C57F\">4<\u002Fspan>\n          <span style=\"font-size:14px;color:#A9A29A\">advogados na banca<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showTestimonials }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"border-top:1px solid #22272F;padding:clamp(56px,8vw,96px) 24px;position:relative;background-image:linear-gradient(180deg,#0A0C0Fcc,#0A0C0Fa6 45%,#0A0C0Fcc),url('https://commons.wikimedia.org/wiki/Special:FilePath/Golden%20Lady%20Justice,%20Bruges,%20Belgium%20(6204837462).jpg?width=1600');background-size:cover;background-position:center\">\n      <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:12px;max-width:60ch\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C9A24A\">Clientes<\u002Fdiv>\n          <h2 style=\"margin:0;font-family:'Marcellus',serif;font-size:clamp(28px,4vw,36px);line-height:1.15\">O que dizem depois do caso encerrado<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n          <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);background:#12161C;border:1px solid #22272F;border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"font-family:'Marcellus',serif;font-size:36px;line-height:.6;color:#C9A24A\">“<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7\">Disputa societária resolvida em acordo antes da audiência. Fui informado de cada passo por escrito, o que nunca tinha acontecido nos escritórios anteriores.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #22272F;padding-top:16px\"><span style=\"font-size:14px;font-weight:600\">Marcelo A.<\u002Fspan><span style=\"font-size:13px;color:#A9A29A\">Indústria metalúrgica · São Paulo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);background:#12161C;border:1px solid #22272F;border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"font-family:'Marcellus',serif;font-size:36px;line-height:.6;color:#C9A24A\">“<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7\">Liguei num sábado e recebi resposta no mesmo dia. Revisaram todos os nossos contratos de fornecimento e reduziram muito nossa exposição.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #22272F;padding-top:16px\"><span style=\"font-size:14px;font-weight:600\">Renata V.<\u002Fspan><span style=\"font-size:13px;color:#A9A29A\">Distribuidora de alimentos · Campinas<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);background:#12161C;border:1px solid #22272F;border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"font-family:'Marcellus',serif;font-size:36px;line-height:.6;color:#C9A24A\">“<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7\">Inventário que estava parado há três anos foi concluído em oito meses. Explicaram cada custo antes, sem surpresa nenhuma na conta final.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #22272F;padding-top:16px\"><span style=\"font-size:14px;font-weight:600\">Paulo H.<\u002Fspan><span style=\"font-size:13px;color:#A9A29A\">Pessoa física · Santo André<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showFaq }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"faq\" style=\"border-top:1px solid #22272F;padding:clamp(56px,8vw,96px) 24px\">\n      <div style=\"max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:36px\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#C9A24A\">Dúvidas frequentes<\u002Fdiv>\n          <h2 style=\"margin:0;font-family:'Marcellus',serif;font-size:clamp(28px,4vw,36px);line-height:1.15\">Antes de ligar, talvez isso já responda<\u002Fh2>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column\">\n          <div style=\"border-top:1px solid #22272F\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t0 }}\" style=\"width:100%;background:none;border:0;color:#F5F1E8;font-family:'Source Sans 3',sans-serif;font-size:18px;text-align:left;padding:24px 0;display:flex;gap:24px;align-items:center;cursor:pointer\">\n              <span style=\"flex:1\">A primeira conversa é cobrada?<\u002Fspan>\n              <span style=\"color:#C9A24A;font-size:22px;line-height:1\">{{ s0 }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:0;padding:0 0 24px;max-width:70ch;font-size:16px;line-height:1.7;color:#A9A29A;display:{{ d0 }}\">Não. A análise inicial do caso, por telefone ou WhatsApp, é gratuita e sem compromisso. Só existe cobrança depois de uma proposta de honorários aceita por escrito.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #22272F\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t1 }}\" style=\"width:100%;background:none;border:0;color:#F5F1E8;font-family:'Source Sans 3',sans-serif;font-size:18px;text-align:left;padding:24px 0;display:flex;gap:24px;align-items:center;cursor:pointer\">\n              <span style=\"flex:1\">Como funcionam os honorários?<\u002Fspan>\n              <span style=\"color:#C9A24A;font-size:22px;line-height:1\">{{ s1 }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:0;padding:0 0 24px;max-width:70ch;font-size:16px;line-height:1.7;color:#A9A29A;display:{{ d1 }}\">Depende do caso: valor fixo por serviço, mensalidade para empresas ou percentual sobre o êxito. Em todos os formatos você recebe o contrato antes de qualquer trabalho começar.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #22272F\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t2 }}\" style=\"width:100%;background:none;border:0;color:#F5F1E8;font-family:'Source Sans 3',sans-serif;font-size:18px;text-align:left;padding:24px 0;display:flex;gap:24px;align-items:center;cursor:pointer\">\n              <span style=\"flex:1\">Atendem fora de São Paulo?<\u002Fspan>\n              <span style=\"color:#C9A24A;font-size:22px;line-height:1\">{{ s2 }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:0;padding:0 0 24px;max-width:70ch;font-size:16px;line-height:1.7;color:#A9A29A;display:{{ d2 }}\">Sim. Processos são conduzidos em todo o Brasil, com reuniões por vídeo e apoio de correspondentes quando há audiência presencial em outro estado.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #22272F\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t3 }}\" style=\"width:100%;background:none;border:0;color:#F5F1E8;font-family:'Source Sans 3',sans-serif;font-size:18px;text-align:left;padding:24px 0;display:flex;gap:24px;align-items:center;cursor:pointer\">\n              <span style=\"flex:1\">Já tenho advogado. Posso trocar?<\u002Fspan>\n              <span style=\"color:#C9A24A;font-size:22px;line-height:1\">{{ s3 }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:0;padding:0 0 24px;max-width:70ch;font-size:16px;line-height:1.7;color:#A9A29A;display:{{ d3 }}\">Pode, em qualquer fase do processo. Cuidamos da substituição de procuração e da obtenção dos autos com o profissional anterior.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #22272F;border-bottom:1px solid #22272F\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t4 }}\" style=\"width:100%;background:none;border:0;color:#F5F1E8;font-family:'Source Sans 3',sans-serif;font-size:18px;text-align:left;padding:24px 0;display:flex;gap:24px;align-items:center;cursor:pointer\">\n              <span style=\"flex:1\">Quanto tempo leva o meu caso?<\u002Fspan>\n              <span style=\"color:#C9A24A;font-size:22px;line-height:1\">{{ s4 }}<\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:0;padding:0 0 24px;max-width:70ch;font-size:16px;line-height:1.7;color:#A9A29A;display:{{ d4 }}\">Nenhum escritório sério promete prazo. Na primeira conversa apresentamos o histórico de casos semelhantes e as vias possíveis, incluindo acordo, que costuma ser mais rápido.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section style=\"border-top:1px solid #22272F;padding:clamp(64px,9vw,112px) 24px;background-color:#0A0C0F;background-image:linear-gradient(180deg,rgba(10,12,15,.86) 0%,rgba(10,12,15,.94) 100%),url('https://commons.wikimedia.org/wiki/Special:FilePath/Law%20library%20in%20the%20Essex%20County%20Courthouse,%20Salem,%20Massachusetts.jpg?width=1400');background-size:cover;background-position:center 25%\">\n      <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);max-width:1200px;margin:0 auto;background:#12161C;border:1px solid #2C323B;border-radius:4px;box-shadow:0 24px 48px rgba(0,0,0,.55);padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n          <h2 style=\"margin:0;font-family:'Marcellus',serif;font-size:clamp(28px,4.4vw,42px);line-height:1.1\">Conte o seu caso.<br><span style=\"color:#C9A24A\">A primeira conversa é hoje.<\u002Fspan><\u002Fh2>\n          <p style=\"margin:0;font-size:17px;line-height:1.7;color:#A9A29A;max-width:48ch\">Chame no WhatsApp ou ligue. Em até duas horas, em dia útil, você fala com o advogado responsável — sem formulário, sem fila.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n          <a href=\"{{ waLink }}\" style=\"background:#C9A24A;color:#0A0C0F;border-radius:4px;padding:22px 30px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;transition:transform .24s cubic-bezier(.16,1,.3,1),box-shadow .24s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.02);box-shadow:0 12px 32px rgba(201,162,74,.28);color:#0A0C0F\">WhatsApp · {{ waDisplay }}<\u002Fa>\n          <a href=\"{{ telLink }}\" style=\"border:1px solid #2C323B;color:#F5F1E8;border-radius:4px;padding:22px 30px;font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;transition:transform .24s cubic-bezier(.16,1,.3,1),border-color .24s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.02);border-color:#C9A24A;color:#F5F1E8\">Ligar · {{ phoneDisplay }}<\u002Fa>\n          <span style=\"font-size:13px;color:#A9A29A;text-align:center\">{{ hours }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"border-top:1px solid #22272F;padding:56px 24px 40px\">\n      <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:'Marcellus',serif;font-size:17px;letter-spacing:.06em\">{{ firmName }}<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.7;color:#A9A29A\">{{ firmTagline }}<br>{{ oab }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C9A24A\">Navegação<\u002Fdiv>\n          <a href=\"#areas\" style=\"font-size:14px;color:#A9A29A\">Áreas de atuação<\u002Fa>\n          <a href=\"#escritorio\" style=\"font-size:14px;color:#A9A29A\">O escritório<\u002Fa>\n          <a href=\"#resultados\" style=\"font-size:14px;color:#A9A29A\">Resultados<\u002Fa>\n          <a href=\"#faq\" style=\"font-size:14px;color:#A9A29A\">Dúvidas frequentes<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#C9A24A\">Contato<\u002Fdiv>\n          <a href=\"{{ telLink }}\" style=\"font-size:14px;color:#A9A29A\">{{ phoneDisplay }}<\u002Fa>\n          <a href=\"{{ waLink }}\" style=\"font-size:14px;color:#A9A29A\">WhatsApp {{ waDisplay }}<\u002Fa>\n          <a href=\"{{ mailLink }}\" style=\"font-size:14px;color:#A9A29A\">{{ email }}<\u002Fa>\n          <span style=\"font-size:14px;color:#A9A29A;line-height:1.7\">{{ addressLine1 }}<br>{{ addressLine2 }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:1200px;margin:40px auto 0;padding-top:24px;border-top:1px solid #22272F;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:#8A8F98\">\n        <span>© 2026 {{ firmName }} · {{ firmTagline }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{},&quot;firmName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ALMEIDA ADVOCACIA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Escritório&quot;},&quot;firmInitials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Escritório&quot;},&quot;firmTagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SOCIEDADE DE ADVOGADOS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Escritório&quot;},&quot;oab&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;OAB/SP 00.000&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Escritório&quot;},&quot;heroEyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Atendimento em todo o Brasil&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Escritório&quot;},&quot;phoneDisplay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;(11) 3333-4444&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;waDisplay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;(11) 99999-9999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;waNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5511999999999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;contato@almeidaadvocacia.com.br&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;addressLine1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rua Exemplo 1000, cj. 82&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;addressLine2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;São Paulo · SP&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;hours&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Atendimento de segunda a sexta, 9h às 19h&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9A24A&quot;,&quot;options&quot;:[&quot;#C9A24A&quot;,&quot;#B8863B&quot;,&quot;#8A9BA8&quot;,&quot;#7E8C6A&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;revealStagger&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:90,&quot;min&quot;:0,&quot;max&quot;:220,&quot;step&quot;:10,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Aparência&quot;},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;},&quot;showTestimonials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;},&quot;showFaq&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nclass Component extends DCLogic {\n  state = { open: -1 };\n\n  static DEFAULTS = {\n    firmName: 'ALMEIDA ADVOCACIA',\n    firmInitials: 'AA',\n    firmTagline: 'SOCIEDADE DE ADVOGADOS',\n    oab: 'OAB/SP 00.000',\n    phoneDisplay: '(11) 3333-4444',\n    waDisplay: '(11) 99999-9999',\n    waNumber: '5511999999999',\n    email: 'contato@almeidaadvocacia.com.br',\n    addressLine1: 'Rua Exemplo 1000, cj. 82',\n    addressLine2: 'São Paulo · SP',\n    heroEyebrow: 'Atendimento em todo o Brasil',\n    hours: 'Atendimento de segunda a sexta, 9h às 19h'\n  };\n\n  componentDidMount() {\n    this.observeReveals();\n    this.applyAccent();\n    this.fitNav();\n    this._onNavResize = () => this.fitNav();\n    window.addEventListener('resize', this._onNavResize);\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n    if (this._onNavResize) window.removeEventListener('resize', this._onNavResize);\n  }\n\n  fitNav() {\n    const links = document.querySelector('[data-nav-links]');\n    const cta = document.querySelector('[data-nav-cta]');\n    const w = window.innerWidth;\n    if (links) links.style.display = w < 940 ? 'none' : 'flex';\n    if (cta) cta.style.padding = w < 480 ? '12px 16px' : '13px 22px';\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.accentColor !== this.props.accentColor) this.applyAccent();\n  }\n\n  applyAccent() {\n    const accent = this.props.accentColor;\n    if (!accent || accent.toUpperCase() === '#C9A24A') return;\n    const light = accent;\n    document.querySelectorAll('[style*=\"C9A24A\"],[style*=\"E3C57F\"]').forEach(el => {\n      el.setAttribute('style', el.getAttribute('style')\n        .split('#C9A24A').join(accent)\n        .split('#E3C57F').join(light)\n        .split('rgba(201,162,74').join('rgba(201,162,74'));\n    });\n  }\n\n  observeReveals() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) {\n      els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      return;\n    }\n    const groups = new Map();\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const parent = e.target.parentElement;\n        const n = groups.get(parent) || 0;\n        groups.set(parent, n + 1);\n        const delay = Math.min(n, 6) * (this.props.revealStagger != null ? this.props.revealStagger : 90);\n        setTimeout(() => {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'translateY(0)';\n        }, delay);\n        this.io.unobserve(e.target);\n      });\n    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });\n    els.forEach(el => this.io.observe(el));\n  }\n\n  renderVals() {\n    const open = this.state.open;\n    const D = Component.DEFAULTS;\n    const p = this.props;\n    const g = (k) => (p[k] != null && p[k] !== '' ? p[k] : D[k]);\n    const wa = g('waNumber');\n    const vals = {\n      firmName: g('firmName'),\n      firmInitials: g('firmInitials'),\n      firmTagline: g('firmTagline'),\n      oab: g('oab'),\n      phoneDisplay: g('phoneDisplay'),\n      waDisplay: g('waDisplay'),\n      email: g('email'),\n      addressLine1: g('addressLine1'),\n      addressLine2: g('addressLine2'),\n      heroEyebrow: g('heroEyebrow'),\n      hours: g('hours'),\n      waLink: 'https://wa.me/' + String(wa).replace(/\\D/g, ''),\n      telLink: 'tel:+55' + String(g('phoneDisplay')).replace(/\\D/g, ''),\n      mailLink: 'mailto:' + g('email'),\n      showStats: p.showStats !== false,\n      showTestimonials: p.showTestimonials !== false,\n      showFaq: p.showFaq !== false\n    };\n    for (let i = 0; i < 5; i++) {\n      vals['t' + i] = () => this.setState(s => ({ open: s.open === i ? -1 : i }));\n      vals['d' + i] = open === i ? 'block' : 'none';\n      vals['s' + i] = open === i ? '−' : '+';\n    }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<style id=\"premium-extras-style\">\nhtml{scroll-behavior:smooth}\n#premium-progress{position:fixed;top:0;left:0;height:6px;background:linear-gradient(90deg,#C9A24A,#F0D98C);z-index:99999;width:0%;box-shadow:0 0 16px 2px #C9A24A;pointer-events:none}\nbutton,a[href]{transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s cubic-bezier(.16,1,.3,1),filter .28s ease}\nbutton:hover,a[href]:hover{transform:translateY(-4px) scale(1.03);filter:brightness(1.1)}\nbutton:active,a[href]:active{transform:translateY(-1px) scale(1.01)}\n<\u002Fstyle>\n<script id=\"premium-extras-script\">\n(function(){\n  var bar=document.createElement('div');bar.id='premium-progress';document.body.appendChild(bar);\n  function upd(){\n    var h=document.documentElement,b=document.body;\n    var st=h.scrollTop||b.scrollTop;\n    var sh=(h.scrollHeight||b.scrollHeight)-h.clientHeight;\n    bar.style.width=(sh>0?Math.min(100,st/sh*100):0)+'%';\n  }\n  document.addEventListener('scroll',upd,{passive:true});\n  window.addEventListener('resize',upd);\n  upd();\n\n  var heroEl=document.querySelector('[style*=\"background-image\"]');\n  if(heroEl){\n    var ticking=false;\n    window.addEventListener('scroll',function(){\n      if(ticking)return;ticking=true;\n      requestAnimationFrame(function(){\n        var y=window.scrollY;\n        var range=window.innerHeight*1.4;\n        var t=Math.min(1,y/range);\n        heroEl.style.backgroundPosition='center '+(50+t*35)+'%';\n        heroEl.style.backgroundSize=(100+t*18)+'%';\n        ticking=false;\n      });\n    },{passive:true});\n  }\n})();\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
